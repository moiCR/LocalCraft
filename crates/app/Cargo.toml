[package]
name = "LocalCraft"
version = "0.1.0"
edition = "2024"
description = "A native desktop manager for local Minecraft servers."
authors = ["moiCR"]
homepage = "https://github.com/moiCR/LocalCraft"
repository = "https://github.com/moiCR/LocalCraft"

[package.metadata.packager]
product-name = "LocalCraft"
identifier = "com.moiCR.LocalCraft"
publisher = "moiCR"
out-dir = "../../target/packager"
icons = ["../../target/packager/windows-assets/localcraft.ico"]
resources = [{ src = "../../target/packager/windows-assets/vcruntime140.dll", target = "vcruntime140.dll" }]
before-packaging-command = "powershell -NoProfile -ExecutionPolicy Bypass -File ../../packaging/windows/prepare.ps1"

[package.metadata.packager.nsis]
installer-icon = "../../target/packager/windows-assets/localcraft.ico"
installMode = "currentUser"
compression = "lzma"

[[bin]]
name = "LocalCraft"
path = "src/main.rs"

[dependencies]
gpui-pre.workspace = true
gpui-router.workspace = true
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", package = "gpui-kit" }
tokio.workspace = true
smol.workspace = true
serde.workspace = true

ui.workspace = true
assets.workspace = true

services.workspace = true

anyhow.workspace = true

[dev-dependencies]
gpui = { package = "gpui-pre", version = "0.3.6", features = ["test-support"] }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", package = "gpui-kit", features = ["test-support"] }

[build-dependencies]
resvg = "0.46.0"
winres = "0.1.12"
