[package]
name = "LocalCraft"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "LocalCraft"
path = "src/main.rs"

[dependencies]
gpui-pre.workspace = true
gpui-router.workspace = true
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", package = "gpui-kit" }
tokio.workspace = true
smol.workspace = true
serde.workspace = true

ui.workspace = true
assets.workspace = true

services.workspace = true

anyhow.workspace = true

[dev-dependencies]
gpui = { package = "gpui-pre", version = "0.3.6", features = ["test-support"] }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", package = "gpui-kit", features = ["test-support"] }

[build-dependencies]
resvg = "0.46.0"
winres = "0.1.12"
